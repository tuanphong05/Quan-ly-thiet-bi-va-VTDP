<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>LTH - Thiết bị & Vật tư dự phòng</title>
<style>
:root{--blue:#1a3a6b;--blue-light:#e8eef7;--accent:#c0392b;--border:#cdd3db;--bg:#f4f6f9;--white:#fff;--text:#1e2a3a;--muted:#6b7a8d;--ok:#1e7e4f;--wa:#b36200;--radius:8px;--shadow:0 2px 8px rgba(0,0,0,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:13px;display:flex;flex-direction:column;height:100vh}
.hidden{display:none!important}button{font:inherit;cursor:pointer}
.btn{padding:7px 12px;border-radius:6px;border:1px solid var(--blue);background:var(--blue);color:#fff;font-weight:600;font-size:12px}
.btn-o{background:#fff;color:var(--blue)}.btn-d{background:#fff;color:var(--accent);border-color:var(--accent)}.btn-s{padding:4px 9px;font-size:11.5px}.btn:disabled{opacity:.5}
#login{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center}
.lc{background:#fff;border:1px solid var(--border);border-radius:18px;padding:36px 44px;width:400px;max-width:92vw;box-shadow:0 24px 64px rgba(10,25,50,.25);display:flex;flex-direction:column;align-items:center}
.lc h2{font-size:14px;color:var(--blue);text-align:center;line-height:1.5}.lc small{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:2px 0 18px}
.lc label{align-self:flex-start;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.lc input{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font:inherit;font-size:14px;margin-bottom:12px;background:#f8f9fb}
.lc .btn{width:100%;padding:12px;font-size:14px}#le{color:var(--accent);font-size:12px;font-weight:600;min-height:18px;margin-top:8px}
.top{height:64px;flex-shrink:0;background:var(--blue);color:#fff;display:flex;align-items:center;gap:12px;padding:0 20px;box-shadow:0 2px 8px #0003}
.bn{font-size:15px;font-weight:800}.bs{font-size:11px;opacity:.8}
.clk{margin-left:auto;text-align:right;line-height:1.4}.clk div:first-child{font-size:12px;opacity:.85}.clk div:last-child{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.shell{display:flex;flex:1;min-height:0}
.nav{width:226px;flex-shrink:0;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column}
.nu{padding:14px;border-bottom:1px solid var(--border);text-align:center;font-size:12.5px;font-weight:700;color:var(--blue);line-height:1.35}
.nu small{display:block;font-size:10.5px;font-weight:400;color:var(--muted);text-transform:uppercase;margin-top:5px}
.na{padding:10px 14px 14px;border-bottom:1px solid var(--border)}
.ml{padding:10px}.mi{display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--radius);cursor:pointer;font-size:12.5px;font-weight:600;margin-bottom:2px;border-left:3px solid transparent}
.mi:hover,.mi.on{background:var(--blue-light)}.mi.on{border-left-color:var(--blue);color:var(--blue)}
.nh{margin-top:auto;padding:12px 14px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);text-align:center}
.main{flex:1;min-width:0;overflow:auto}.pg{padding:16px 20px}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.ph h2{font-size:17px;color:var(--blue);margin-right:auto}
.ph input,.ph select{padding:6px 10px;border:1px solid var(--border);border-radius:6px;font:inherit;background:#fff}
.ch{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.ch button{border:1px solid var(--border);background:#fff;border-radius:99px;padding:4px 12px}.ch .on{border-color:var(--blue);color:var(--blue);font-weight:700}
.tw{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow-x:auto;box-shadow:var(--shadow);margin-bottom:14px}
table{width:100%;border-collapse:collapse;min-width:680px}th{background:var(--blue);color:#fff;text-align:center;padding:8px 10px;font-size:12px;white-space:nowrap}
td{padding:8px 10px;border-top:1px solid var(--border);vertical-align:top}.mu{color:var(--muted);font-size:12px}.c{text-align:center}
.st{font-size:11.5px;font-weight:700;border:1px solid;border-radius:99px;padding:1px 9px;white-space:nowrap}
.rs{margin-top:4px;padding:4px 8px;border-left:3px solid var(--border);font-size:12px}
.th{width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--border);margin-right:4px;cursor:pointer}
.mo{position:fixed;inset:0;background:#0007;z-index:40;display:flex;align-items:center;justify-content:center}
.mb{background:#fff;border-radius:12px;padding:18px;width:460px;max-width:94vw;max-height:92vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.mb input,.mb select,.mb textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font:inherit}
.mb label{font-size:11.5px;font-weight:700;color:var(--muted);margin-top:2px}.mb h3{color:var(--blue);font-size:15px}.mb .r{display:flex;gap:8px;justify-content:flex-end}
#er{color:var(--accent);font-size:12px;min-height:16px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1e2a3a;color:#fff;padding:8px 14px;border-radius:8px;z-index:70;font-size:12.5px}.toast.er{background:#c0392b}.toast:empty{display:none}
@media(max-width:760px){.shell{flex-direction:column}.nav{width:100%;flex-direction:row;flex-wrap:wrap}.nu,.nh{display:none}}
</style></head><body>

<div id="login"><div class="lc">
<h2>TRUNG TÂM KIỂM SOÁT KHÔNG LƯU LONG THÀNH</h2><small>Quản lý thiết bị & vật tư dự phòng</small>
<label>Tài khoản</label><input id="lu" autocomplete="username">
<label>Mật khẩu</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')dn()">
<button class="btn" id="lb" onclick="dn()">Đăng nhập</button><div id="le"></div></div></div>

<div class="top"><div><div class="bn">LTH - Thiết bị & Vật tư dự phòng</div><div class="bs">ATCC Long Thành</div></div>
<div class="clk"><div id="cd"></div><div id="ct"></div></div></div>
<div class="shell">
<div class="nav"><div class="nu"><span id="un">-</span><small id="ur"></small></div>
<div class="na"><button class="btn btn-o btn-s" style="width:100%" onclick="location.reload()">Đăng xuất</button></div>
<div class="ml" id="menu"></div><div class="nh">Dữ liệu lưu trên Google Sheets</div></div>
<div class="main" id="main"></div></div>
<div class="mo hidden" id="mo"><div class="mb"><h3 id="mt"></h3><div id="mbody"></div><div id="er"></div>
<div class="r"><button class="btn btn-o" onclick="cm()">Đóng</button><button class="btn" id="ok">Lưu</button></div></div></div>
<div class="toast" id="toast"></div>

<script>
const API='DAN_URL_WEB_APP_APPS_SCRIPT_VAO_DAY';
const $=id=>document.getElementById(id),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ST=['Tốt','Cảnh báo','Hư hỏng','Đang sửa chữa'],COL={'Tốt':'#1e7e4f','Cảnh báo':'#b36200','Hư hỏng':'#c0392b','Đang sửa chữa':'#1a56b8'};
const MENU=[['equip','Khối thiết bị'],['spare','Vật tư dự phòng'],['fail','Hư hỏng'],['swap','Thay thế VTDP']];
let TK='',U={},D={equip:[],spare:[],fail:[],cfg:[],swap:[]},V='equip',F='all',G='all',S='',Y=new Date().getFullYear();
const adm=()=>U.role==='quantri',today=()=>new Date().toISOString().slice(0,10);
const th=id=>`https://drive.google.com/thumbnail?id=${id}&sz=w300`,big=id=>`https://drive.google.com/file/d/${id}/view`;
const nmE=id=>(D.equip.find(x=>x.id==id)||{}).ten||id,nmS=id=>(D.spare.find(x=>x.id==id)||{}).ten||id;
let tt;function toast(m,er){const t=$('toast');t.textContent=m;t.className='toast'+(er?' er':'');clearTimeout(tt);tt=setTimeout(()=>t.textContent='',2800)}
async function api(a,p={}){const r=await fetch(API,{method:'POST',body:JSON.stringify({a,tk:TK,...p})}),j=await r.json();if(j.err)throw new Error(j.err);return j}
async function dn(){$('le').textContent='';$('lb').disabled=true;try{const j=await api('login',{u:$('lu').value.trim(),p:$('lp').value});TK=j.tk;U=j.us;D=j.d;
 $('login').classList.add('hidden');$('un').textContent=U.ten;$('ur').textContent=adm()?'Quản trị':'Chỉ xem';render()}catch(e){$('le').textContent=e.message}$('lb').disabled=false}
function tick(){const n=new Date();$('cd').textContent=n.toLocaleDateString('vi-VN',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'});$('ct').textContent=n.toLocaleTimeString('vi-VN')}setInterval(tick,1000);tick();
function mdl(t,h,ok){$('mt').textContent=t;$('mbody').innerHTML=h;$('er').textContent='';$('mo').classList.remove('hidden');$('ok').style.display=ok?'':'none';
 $('ok').onclick=async()=>{$('er').textContent='';$('ok').disabled=true;try{if(await ok())cm()}catch(e){$('er').textContent=e.message}$('ok').disabled=false}}
const cm=()=>$('mo').classList.add('hidden');
const up=f=>new Promise((res,rej)=>{const im=new Image();im.onerror=()=>rej(new Error('Không đọc được ảnh'));im.onload=async()=>{const s=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
 try{res((await api('up',{b64:c.toDataURL('image/jpeg',.8).split(',')[1]})).id)}catch(e){rej(e)}};im.src=URL.createObjectURL(f)});
const chip=t=>`<span class="st" style="color:${COL[t]||'#666'}">${E(t)}</span>`;
const imgs=(...ids)=>ids.filter(Boolean).map(i=>`<a href="${big(i)}" target="_blank"><img class="th" src="${th(i)}"></a>`).join('');

const FD={equip:[['ten','Tên khối thiết bị'],['sl','Số lượng','number'],['nhom','Thuộc nhóm hệ thống','dl'],['tt','Tình trạng hoạt động','sel'],['sn','Serial number'],['pn','Part number'],['ghichu','Ghi chú','ta'],['anh','Ảnh thiết bị','img']],
spare:[['ten','Tên vật tư dự phòng'],['sl','Số lượng','number'],['nhom','Thuộc nhóm hệ thống','dl'],['tt','Tình trạng','sel'],['sn','Serial number'],['pn','Part number'],['cauhinh','Tình trạng cấu hình (VD: đã cài ghost của RHP2)','ta'],['anh','Ảnh vật tư','img'],['anhtem','Ảnh tem quản lý VTDP','img']]};
function fld([k,l,t],o){const v=o[k]??'';let i;
 if(t==='ta')i=`<textarea id="f_${k}" rows="3">${E(v)}</textarea>`;
 else if(t==='sel')i=`<select id="f_${k}">${ST.map(s=>`<option ${s==v?'selected':''}>${s}</option>`).join('')}</select>`;
 else if(t==='dl')i=`<input id="f_${k}" list="dl" value="${E(v)}">`;
 else if(t==='img')i=`${v?imgs(v):''}<input type="file" id="f_${k}" accept="image/*">`;
 else i=`<input id="f_${k}" type="${t||'text'}" value="${E(v)}">`;return `<label>${l}</label>${i}`}
function ed(t,id){const o=id?D[t].find(x=>x.id==id):{tt:'Tốt',sl:1},nh=[...new Set([...D.equip,...D.spare].map(x=>x.nhom).filter(Boolean))];
 mdl((id?'Sửa ':'Thêm ')+(t==='equip'?'khối thiết bị':'vật tư dự phòng'),`<datalist id="dl">${nh.map(x=>`<option value="${E(x)}">`).join('')}</datalist>`+FD[t].map(f=>fld(f,o)).join(''),async()=>{
 const r={...o};for(const [k,,ty] of FD[t]){const el=$('f_'+k);if(ty==='img'){if(el.files[0])r[k]=await up(el.files[0])}else r[k]=el.value}
 if(!r.ten)throw new Error('Vui lòng nhập tên');D=await api('save',{t,row:r});render();toast('Đã lưu');return true})}
async function del(t,id){if(!confirm('Xóa bản ghi này?'))return;try{D=await api('del',{t,id});render();toast('Đã xóa')}catch(e){toast(e.message,1)}}
function hist(id){const h=D.cfg.filter(x=>x.spareId==id).sort((a,b)=>b.ngay>a.ngay?1:-1);
 mdl('Lịch sử cấu hình - '+nmS(id),h.map(x=>`<div class="rs"><b>${E(x.ngay)}</b> - ${E(x.nguoi)}<br>${E(x.noidung)}</div>`).join('')||'<div class="mu">Chưa có lịch sử.</div>')}

function head(title,extra){return `<div class="ph"><h2>${title}</h2>${extra||''}</div>`}
function render(){$('menu').innerHTML=MENU.map(([k,l])=>`<div class="mi ${V===k?'on':''}" onclick="V='${k}';F='all';G='all';S='';render()">${l}</div>`).join('');
 $('main').innerHTML=`<div class="pg">${V==='equip'||V==='spare'?listV(V):V==='fail'?failV():swapV()}</div>`;if(V==='equip'||V==='spare')rows()}
function listV(t){const gs=[...new Set(D[t].map(x=>x.nhom).filter(Boolean))].sort();
 return head(t==='equip'?'Khối thiết bị':'Vật tư dự phòng',`<input placeholder="Tìm tên, S/N, P/N..." value="${E(S)}" oninput="S=this.value;rows()">
 <select onchange="G=this.value;rows()"><option value="all">Tất cả nhóm hệ thống</option>${gs.map(g=>`<option ${g==G?'selected':''}>${E(g)}</option>`).join('')}</select>
 ${adm()?`<button class="btn" onclick="ed('${t}')">+ Thêm</button>`:''}`)+
 `<div class="ch">${['all',...ST].map(s=>`<button class="${F===s?'on':''}" onclick="F='${s}';render()">${s==='all'?'Tất cả':s}</button>`).join('')}</div>
 <div class="tw"><table><thead><tr><th>Ảnh</th><th>Tên</th><th>SL</th><th>Nhóm hệ thống</th><th>Tình trạng</th><th>S/N</th><th>P/N</th><th>${t==='equip'?'Số lần hư hỏng':'Cấu hình'}</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>`}
function rows(){const t=V,q=S.toLowerCase(),a=D[t].filter(x=>(F==='all'||x.tt===F)&&(G==='all'||x.nhom===G)&&[x.ten,x.sn,x.pn,x.nhom].join(' ').toLowerCase().includes(q));
 $('tb').innerHTML=a.map(x=>`<tr><td>${imgs(x.anh,x.anhtem)}</td><td><b>${E(x.ten)}</b>${x.ghichu?`<div class="mu">${E(x.ghichu)}</div>`:''}<div class="mu">Cập nhật ${E(x.capnhat)} - ${E(x.nguoi)}</div></td>
 <td class="c">${E(x.sl)}</td><td>${E(x.nhom)}</td><td class="c">${chip(x.tt)}</td><td>${E(x.sn)}</td><td>${E(x.pn)}</td>
 <td>${t==='equip'?`<div class="c"><b>${D.fail.filter(f=>f.equipId==x.id).length}</b></div>`:`${E(x.cauhinh)}<div><a href="#" onclick="hist('${x.id}');return false">Lịch sử</a></div>`}</td>
 <td>${adm()?`<button class="btn btn-o btn-s" onclick="ed('${t}','${x.id}')">Sửa</button> <button class="btn btn-d btn-s" onclick="del('${t}','${x.id}')">Xóa</button>`:''}</td></tr>`).join('')||'<tr><td colspan="9" class="mu">Không có dữ liệu.</td></tr>'}

function failV(){const ys=[...new Set([Y,...D.fail.map(f=>+String(f.ngay).slice(0,4)).filter(Boolean)])].sort(),m=[...Array(12).keys()],
 st=D.equip.map(e=>{const c=m.map(i=>D.fail.filter(f=>f.equipId==e.id&&String(f.ngay).startsWith(Y+'-'+String(i+1).padStart(2,'0'))).length);return{e,c,n:c.reduce((a,b)=>a+b,0)}}).filter(r=>r.n);
 return head('Theo dõi hư hỏng',`<select onchange="Y=+this.value;render()">${ys.map(y=>`<option ${y==Y?'selected':''}>${y}</option>`).join('')}</select>${adm()?'<button class="btn" onclick="addFail()">+ Ghi nhận hư hỏng</button>':''}`)+
 `<div class="tw"><table><thead><tr><th>Thống kê ${Y}</th>${m.map(i=>`<th>T${i+1}</th>`).join('')}<th>Cả năm</th></tr></thead><tbody>${st.map(r=>`<tr><td>${E(r.e.ten)}</td>${r.c.map(v=>`<td class="c">${v||''}</td>`).join('')}<td class="c"><b>${r.n}</b></td></tr>`).join('')||'<tr><td colspan="14" class="mu">Chưa có hư hỏng trong năm này.</td></tr>'}</tbody></table></div>
 <div class="tw"><table><thead><tr><th>Ngày</th><th>Khối thiết bị</th><th>Mô tả</th><th>Nguyên nhân</th><th>Khắc phục</th><th>Người ghi</th><th></th></tr></thead><tbody>${[...D.fail].sort((a,b)=>b.ngay>a.ngay?1:-1).map(f=>`<tr><td>${E(f.ngay)}</td><td><b>${E(nmE(f.equipId))}</b></td><td>${E(f.mota)}</td><td>${E(f.nguyennhan)}</td><td>${E(f.khacphuc)}</td><td>${E(f.nguoi)}</td><td>${adm()?`<button class="btn btn-d btn-s" onclick="del('fail','${f.id}')">Xóa</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7" class="mu">Chưa có bản ghi.</td></tr>'}</tbody></table></div>`}
const opt=(a,k)=>a.map(x=>`<option value="${x.id}">${E(x.ten)}${x.sn?' - '+E(x.sn):''}</option>`).join('');
function addFail(){mdl('Ghi nhận hư hỏng',`<label>Khối thiết bị</label><select id="x1">${opt(D.equip)}</select><label>Ngày</label><input type="date" id="x2" value="${today()}"><label>Mô tả hư hỏng</label><textarea id="x3" rows="2"></textarea><label>Nguyên nhân</label><input id="x4"><label>Cách khắc phục</label><input id="x5">`,async()=>{
 if(!$('x1').value||!$('x3').value)throw new Error('Chọn khối thiết bị và nhập mô tả');
 D=await api('save',{t:'fail',row:{equipId:$('x1').value,ngay:$('x2').value,mota:$('x3').value,nguyennhan:$('x4').value,khacphuc:$('x5').value}});render();toast('Đã ghi nhận');return true})}

function swapV(){return head('Thay thế bằng vật tư dự phòng',adm()?'<button class="btn" onclick="addSwap()">+ Ghi nhận thay thế</button>':'')+
 `<div class="tw"><table><thead><tr><th>Ngày</th><th>Người thay</th><th>Khối thiết bị bị thay</th><th>VTDP sử dụng</th><th>SL</th><th>Ghi chú</th></tr></thead><tbody>${[...D.swap].sort((a,b)=>b.ngay>a.ngay?1:-1).map(s=>`<tr><td>${E(s.ngay)}</td><td>${E(s.nguoi)}</td><td>${E(nmE(s.equipId))}</td><td>${E(nmS(s.spareId))}</td><td class="c">${E(s.sl)}</td><td>${E(s.ghichu)}</td></tr>`).join('')||'<tr><td colspan="6" class="mu">Chưa có bản ghi.</td></tr>'}</tbody></table></div>`}
function addSwap(){mdl('Ghi nhận thay thế',`<label>Khối thiết bị bị thay</label><select id="x1">${opt(D.equip)}</select><label>Vật tư dự phòng sử dụng</label><select id="x2">${opt(D.spare.filter(s=>+s.sl>0))}</select><label>Số lượng</label><input type="number" id="x3" value="1" min="1"><label>Ghi chú</label><input id="x4">`,async()=>{
 if(!$('x1').value||!$('x2').value)throw new Error('Chọn khối thiết bị và vật tư dự phòng');
 D=await api('swap',{row:{equipId:$('x1').value,spareId:$('x2').value,sl:$('x3').value,ghichu:$('x4').value}});render();toast('Đã ghi nhận, số lượng VTDP đã cập nhật');return true})}
</script></body></html>
