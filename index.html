<style>
:root{--blue:#1a3a6b;--blue-light:#e8eef7;--accent:#c0392b;--border:#cdd3db;--bg:#f4f6f9;--white:#fff;--text:#1e2a3a;--muted:#6b7a8d;--ok:#1e7e4f;--wa:#b36200;--radius:8px;--shadow:0 2px 8px rgba(0,0,0,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:13px;display:flex;flex-direction:column;height:100vh}
.hidden{display:none!important}button{font:inherit;cursor:pointer}
.btn{padding:7px 12px;border-radius:6px;border:1px solid var(--blue);background:var(--blue);color:#fff;font-weight:600;font-size:12px}
.btn-o{background:#fff;color:var(--blue)}.btn-d{background:#fff;color:var(--accent);border-color:var(--accent)}.btn-s{padding:4px 9px;font-size:11.5px}.btn:disabled{opacity:.5}
#login{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center}
.lc{background:#fff;border:1px solid var(--border);border-radius:18px;padding:36px 44px;width:400px;max-width:92vw;box-shadow:0 24px 64px rgba(10,25,50,.25);display:flex;flex-direction:column;align-items:center}
.lc h2{font-size:14px;color:var(--blue);text-align:center;line-height:1.5}.lc small{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:2px 0 18px}
.lc label{align-self:flex-start;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.lc input{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font:inherit;font-size:14px;margin-bottom:12px;background:#f8f9fb}
.lc .btn{width:100%;padding:12px;font-size:14px}#le{color:var(--accent);font-size:12px;font-weight:600;min-height:18px;margin-top:8px}
.top{height:64px;flex-shrink:0;background:var(--blue);color:#fff;display:flex;align-items:center;gap:12px;padding:0 20px;box-shadow:0 2px 8px #0003}
.bn{font-size:15px;font-weight:800}.bs{font-size:11px;opacity:.8}
.clk{margin-left:auto;text-align:right;line-height:1.4}.clk div:first-child{font-size:12px;opacity:.85}.clk div:last-child{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.shell{display:flex;flex:1;min-height:0}
.nav{width:226px;flex-shrink:0;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
.nu{padding:14px;border-bottom:1px solid var(--border);text-align:center;font-size:12.5px;font-weight:700;color:var(--blue);line-height:1.35}
.nu small{display:block;font-size:10.5px;font-weight:400;color:var(--muted);text-transform:uppercase;margin-top:5px}
.na{padding:10px 14px 14px;border-bottom:1px solid var(--border)}
.ml{padding:10px}.mi{display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--radius);cursor:pointer;font-size:12.5px;font-weight:600;margin-bottom:2px;border-left:3px solid transparent}
.mi:hover,.mi.on{background:var(--blue-light)}.mi.on{border-left-color:var(--blue);color:var(--blue)}
.ms{padding:9px 10px;font-size:12.5px;font-weight:600;gap:6px}.ms.gr{color:var(--blue);background:var(--blue-light)}
.sb{padding:7px 10px 7px 30px;font-size:12px;font-weight:500}.ms span{width:12px;flex-shrink:0;font-size:10px}
.nh{margin-top:auto;padding:12px 14px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);text-align:center}
.main{flex:1;min-width:0;overflow:auto}.pg{padding:16px 20px}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.ph h2{font-size:17px;color:var(--blue);margin-right:auto}
.ph input,.ph select{padding:6px 10px;border:1px solid var(--border);border-radius:6px;font:inherit;background:#fff}
.ch{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.ch button{border:1px solid var(--border);background:#fff;border-radius:99px;padding:4px 12px}.ch .on{border-color:var(--blue);color:var(--blue);font-weight:700}
.lg{width:44px;height:44px;border-radius:50%;flex-shrink:0;background:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.ll{width:84px;height:84px;margin-bottom:10px}
#zoom{position:fixed;z-index:60;display:none;pointer-events:none;background:#fff;padding:4px;border-radius:10px;box-shadow:0 10px 36px rgba(0,0,0,.35)}
#zoom img{display:block;max-width:420px;max-height:420px;border-radius:6px}
#lbx{position:fixed;inset:0;z-index:65;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;cursor:zoom-out}
#lbx img{max-width:92vw;max-height:92vh;border-radius:8px;background:#fff}
.th{transition:transform .12s;cursor:zoom-in}.th:hover{transform:scale(1.06)}
.fbar{background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.tabs{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--border);background:#fafbfd;overflow-x:auto}
.tabs button{display:flex;align-items:center;gap:8px;padding:12px 14px 10px;border:0;border-bottom:3px solid transparent;background:none;color:var(--muted);font-size:12.5px;font-weight:600;white-space:nowrap;transition:.15s}
.tabs button:hover{color:var(--blue);background:var(--blue-light)}.tabs button.on{color:var(--blue);border-bottom-color:var(--blue);background:#fff}
.bd{min-width:24px;padding:1px 7px;border-radius:99px;background:#e4e9f0;color:var(--muted);font-size:11px;font-weight:700;text-align:center}
.tabs .on .bd{background:var(--blue);color:#fff}
.frow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 14px}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:9px;background:#e9edf3;flex-wrap:wrap}
.seg button{display:flex;align-items:center;gap:7px;padding:6px 13px;border:0;border-radius:7px;background:none;color:var(--muted);font-size:12px;font-weight:600;transition:.15s}
.seg button:hover{color:var(--text)}.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.seg i{width:8px;height:8px;border-radius:50%;flex-shrink:0}.seg button span{font-size:11px;font-weight:700;opacity:.65}
.gc{min-width:200px;max-width:320px;white-space:pre-wrap}
.fr2{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.gm{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--blue);cursor:pointer}.gm input{accent-color:var(--blue)}
.gh td{background:var(--blue-light);border-top:2px solid var(--blue);padding:9px 10px;cursor:pointer}.gh:hover td{background:#dde7f5}
.gl{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.gl b{font-size:13px;color:var(--blue)}.tg{width:12px;font-size:10px;color:var(--blue)}.gh .bd{background:var(--blue);color:#fff}
.gi td{background:#fafcff}.gi td:first-child{box-shadow:inset 4px 0 0 var(--blue)}
.tw{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow-x:auto;box-shadow:var(--shadow);margin-bottom:14px}
table.big{width:max-content;min-width:100%}table.big td{font-size:12.5px;vertical-align:top}.stk{position:sticky;right:0;background:#fff;box-shadow:-2px 0 0 var(--border)}th.stk{background:var(--blue)}
.gh .gl{position:sticky;left:12px;width:max-content;max-width:90vw}.mb.wide{width:760px}.fg{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}.fc{display:flex;flex-direction:column;gap:3px}.fc.s2{grid-column:1/-1}
@media(max-width:640px){.fg{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;min-width:680px}th{background:var(--blue);color:#fff;text-align:center;padding:8px 10px;font-size:12px;white-space:nowrap}
td{padding:8px 10px;border-top:1px solid var(--border);vertical-align:top}.mu{color:var(--muted);font-size:12px}.c{text-align:center}
.st{font-size:11.5px;font-weight:700;border:1px solid;border-radius:99px;padding:1px 9px;white-space:nowrap}
.rs{margin-top:4px;padding:4px 8px;border-left:3px solid var(--border);font-size:12px}
.th{width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--border);margin-right:4px;cursor:pointer}
.mo{position:fixed;inset:0;background:#0007;z-index:40;display:flex;align-items:center;justify-content:center}
.mb{background:#fff;border-radius:12px;padding:18px;width:460px;max-width:94vw;max-height:92vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.mb input,.mb select,.mb textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font:inherit}
.mb label{font-size:11.5px;font-weight:700;color:var(--muted);margin-top:2px}.mb h3{color:var(--blue);font-size:15px}.mb .r{display:flex;gap:8px;justify-content:flex-end}
#er{color:var(--accent);font-size:12px;min-height:16px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1e2a3a;color:#fff;padding:8px 14px;border-radius:8px;z-index:70;font-size:12.5px}.toast.er{background:#c0392b}.toast:empty{display:none}
@media(max-width:760px){.shell{flex-direction:column}.nav{width:100%;flex-direction:row;flex-wrap:wrap}.nu,.nh{display:none}}
</style></head><body>

...MAU.map(([k,l])=>k==='tinhtrang'?[k,l,'ds']:k==='ghichu'?[k,l,'ta2']:k==='sl'?[k,l]:[k,l]),
['tt','Tình trạng hoạt động','sel'],...(t==='spare'?[['cauhinh','Tình trạng cấu hình (VD: đã cài ghost của RHP2)','ta2']]:[]),
['anh',t==='equip'?'Ảnh thiết bị':'Ảnh vật tư','img'],...(t==='spare'?[['anhtem','Ảnh tem quản lý vật tư dự phòng','img']]:[])];
const tuH=(n,v)=>{const a=CAB[n]||[];return a.length?`<label>Phân hệ / Tủ thiết bị</label><select id="f_tu"><option value="">-- Chọn tủ --</option>${[...a,...(v&&!a.includes(v)?[v]:[])].map(x=>`<option ${x==v?'selected':''}>${E(x)}</option>`).join('')}</select>`:`<input type="hidden" id="f_tu" value="">`};
const rt=()=>{$('tuw').innerHTML=tuH($('f_nhom').value,'')};
function fld([k,l,t],o){const v=o[k]??'';let i;
 if(t==='tu')return `<div class="fc" id="tuw">${tuH(o.nhom,v)}</div>`;
 if(t==='ta2')i=`<textarea id="f_${k}" rows="3">${E(v)}</textarea>`;
 else if(t==='ds')i=`<input id="f_${k}" list="dl_${k}" value="${E(v)}"><datalist id="dl_${k}">${TS.map(z=>`<option>${z}</option>`).join('')}</datalist>`;
 else if(t==='sel')i=`<select id="f_${k}">${ST.map(s=>`<option ${s==v?'selected':''}>${s}</option>`).join('')}</select>`;
 else if(t==='dl')i=`<select id="f_${k}" onchange="rt()"><option value="">-- Chọn hệ thống --</option>${[...SYS,...(v&&!SYS.includes(v)?[v]:[])].map(s=>`<option ${s==v?'selected':''}>${E(s)}</option>`).join('')}</select>`;
 else if(t==='img')i=`${v?imgs(v):''}<input type="file" id="f_${k}" accept="image/*">`;
 else i=`<input id="f_${k}" type="${t||'text'}" value="${E(v)}">`;return `<div class="fc ${t==='ta2'||t==='img'?'s2':''}"><label>${l}</label>${i}</div>`}
function ed(t,id){const o=id?D[t].find(x=>x.id==id):{tt:'Tốt',sl:'1',nhom:G,tu:C,donvi:DEF_DV,tinhtrang:t==='spare'?'Dự phòng':'Đang sử dụng'};
 mdl((id?'Sửa ':'Thêm ')+(t==='equip'?'khối thiết bị':'vật tư dự phòng'),'<div class="fg">'+FD(t).map(f=>fld(f,o)).join('')+'</div>',async()=>{
 const r={...o};for(const [k,,ty] of FD(t)){const el=$('f_'+k);if(ty==='img'){if(el.files[0])r[k]=await up(el.files[0])}else r[k]=el.value}
 if(!r.ten)throw new Error('Vui lòng nhập Tên sử dụng');if(!r.nhom)throw new Error('Vui lòng chọn hệ thống');if(CAB[r.nhom]&&!r.tu)throw new Error('Vui lòng chọn tủ thiết bị');D=await api('save',{t,row:r});render();toast('Đã lưu');return true},true)}
async function del(t,id){if(!confirm('Xóa bản ghi này?'))return;try{D=await api('del',{t,id});render();toast('Đã xóa')}catch(e){toast(e.message,1)}}
function hist(id){const h=D.cfg.filter(x=>x.spareId==id).sort((a,b)=>b.ngay>a.ngay?1:-1);
 mdl('Lịch sử cấu hình - '+nmS(id),h.map(x=>`<div class="rs"><b>${E(x.ngay)}</b> - ${E(x.nguoi)}<br>${E(x.noidung)}</div>`).join('')||'<div class="mu">Chưa có lịch sử.</div>')}

function head(title,extra){return `<div class="ph"><h2>${title}</h2>${extra||''}</div>`}
const OP=new Set();
const tg=i=>{const g=SYS[i];if(OP.has(g)){OP.delete(g);if(G===g){G='';V='';C=''}}else OP.add(g);render()};
const go=(i,k)=>{if(G!==SYS[i])C=(CAB[SYS[i]]||[])[0]||'';G=SYS[i];V=k;F='all';S='';OP.add(G);render()};
function render(){$('menu').innerHTML=SYS.map((g,i)=>{const o=OP.has(g);return `<div class="mi ms ${G===g?'gr':''}" onclick="tg(${i})"><span>${o?'▼':'▶'}</span>${E(g)}</div>`+(o?MENU.map(([k,l])=>`<div class="mi sb ${G===g&&V===k?'on':''}" onclick="go(${i},'${k}')">${l}</div>`).join(''):'')}).join('');
 if(!V||!G){$('main').innerHTML='<div class="pg"><div class="mu" style="padding:60px 10px;text-align:center;font-size:14px">Chọn một hệ thống ở menu bên trái, sau đó chọn Khối thiết bị, Vật tư dự phòng, Hư hỏng hoặc Thay thế vật tư dự phòng để xem dữ liệu.</div></div>';return}
 $('main').innerHTML=`<div class="pg">${V==='equip'||V==='spare'?listV(V):V==='fail'?failV():swapV()}</div>`;if(V==='equip'||V==='spare')rows()}
function fbar(t){const cb=CAB[G],base=D[t].filter(x=>x.nhom===G),cur=base.filter(x=>!C||x.tu===C);
 const tabs=cb?`<div class="tabs">${cb.map((c,i)=>`<button class="${C===c?'on':''}" onclick="C=CAB[G][${i}];render()">${E(c)}<span class="bd">${base.filter(x=>x.tu===c).length}</span></button>`).join('')}</div>`:'';
 const seg=ST.map(x=>`<button class="${F===x?'on':''}" onclick="F=F==='${x}'?'all':'${x}';render()"><i style="background:${COL[x]}"></i>${x}<span>${cur.filter(y=>y.tt===x).length}</span></button>`).join('');
 return `<div class="fbar">${tabs}<div class="frow"><div class="seg">${seg}</div><div class="fr2"><span class="mu" id="cnt"></span></div></div></div>`}
const CW={stt:80,loai:150,tenkt:190,ten:190,sl:90,sn:120,pn:120,hang:110,xuatxu:90,nam:80,hethong:150,tinhtrang:120,nhomtb:110,diadiem:130,donvi:170,taisan:130,nguyengia:100,ghichu:200};
const cols=t=>[...MAU.map(([k,l])=>({k,l,w:CW[k]})),{k:'tt',l:'Tình trạng hoạt động',w:130},t==='equip'?{k:'hh',l:'Số lần hư hỏng',w:90}:{k:'cauhinh',l:'Tình trạng cấu hình',w:180},{k:'cn',l:'Cập nhật',w:130},{k:'act',l:'Thao tác',w:120}].filter(c=>c.k!=='act'||adm());
function listV(t){
 return head((t==='equip'?'Khối thiết bị':'Vật tư dự phòng')+' - '+E(G)+(C?' - '+E(C):''),`<input placeholder="Tìm theo tên, Serial Number, Part Number, hãng sản xuất..." value="${E(S)}" oninput="S=this.value;rows()">
 ${adm()?`<button class="btn" onclick="ed('${t}')">+ Thêm</button>`:''}`)+
 fbar(t)+`
 <div class="tw"><table class="big"><thead><tr>${cols(t).map(c=>`<th style="min-width:${c.w}px"${c.k==='act'?' class="stk"':''}>${c.l}</th>`).join('')}</tr></thead><tbody id="tb"></tbody></table></div>`}
const cp=(a,b)=>String(a||'').trim().localeCompare(String(b||'').trim(),'vi',{numeric:true,sensitivity:'base'});
const sk=v=>String(v||'').trim().split(/[.,]/).map(n=>parseInt(n)||0);
const cs0=(a,b)=>{const x=String(a.stt||'').trim(),y=String(b.stt||'').trim();if(!x||!y)return x?-1:y?1:0;const p=sk(x),q=sk(y);for(let i=0;i<Math.max(p.length,q.length);i++){const d=(p[i]||0)-(q[i]||0);if(d)return d}return 0};
const cmpX=(a,b)=>cs0(a,b)||cp(nm(a),nm(b))||cp(a.pn,b.pn)||cp(a.sn,b.sn);
function rows(){const t=V,q=S.toLowerCase(),a=D[t].filter(x=>(F==='all'||x.tt===F)&&x.nhom===G&&(!C||x.tu===C)&&[...MAU.map(m=>x[m[0]]),x.tu,x.nhom].join(' ').toLowerCase().includes(q)).sort(cmpX);
 $('cnt').textContent='Hiển thị '+a.length+' mục';
 const cs=cols(t),R=(x,c)=>`<tr class="${c||''}">${cs.map(k=>{const a=k.k;
 if(a==='anh')return `<td>${imgs(x.anh,x.anhtem)}</td>`;
 if(a==='tt')return `<td class="c">${chip(x.tt)}</td>`;
 if(a==='hh')return `<td class="c"><b>${D.fail.filter(f=>f.equipId==x.id).length}</b></td>`;
 if(a==='cauhinh')return `<td>${E(x.cauhinh)}<div><a href="#" onclick="hist('${x.id}');return false">Lịch sử</a></div></td>`;
 if(a==='cn')return `<td class="mu">${E(x.capnhat)}<br>${E(x.nguoi)}</td>`;
 if(a==='act')return `<td class="stk"><button class="btn btn-o btn-s" onclick="ed('${t}','${x.id}')">Sửa</button> <button class="btn btn-d btn-s" onclick="del('${t}','${x.id}')">Xóa</button></td>`;
 return `<td class="${a==='ten'?'':a==='sl'?'c':''}">${a==='ten'?'<b>'+E(x.ten||nm(x))+'</b>':E(x[a])}</td>`}).join('')}</tr>`;
let h='';
 h=a.map(x=>R(x)).join('');
 $('tb').innerHTML=h||'<tr><td colspan="'+cs.length+'" class="mu">Không có dữ liệu.</td></tr>'}
const tgG=i=>{const k=GK[i];CG.has(k)?CG.delete(k):CG.add(k);rows()};

const inG=id=>G==='all'||((D.equip.find(x=>x.id==id)||{}).nhom)===G;
function failV(){const ys=[...new Set([Y,...D.fail.map(f=>+String(f.ngay).slice(0,4)).filter(Boolean)])].sort(),m=[...Array(12).keys()],
 st=D.equip.filter(e=>G==='all'||e.nhom===G).map(e=>{const c=m.map(i=>D.fail.filter(f=>f.equipId==e.id&&String(f.ngay).startsWith(Y+'-'+String(i+1).padStart(2,'0'))).length);return{e,c,n:c.reduce((a,b)=>a+b,0)}}).filter(r=>r.n);
 return head('Theo dõi hư hỏng'+(G==='all'?'':' - '+E(G)),`<select onchange="Y=+this.value;render()">${ys.map(y=>`<option ${y==Y?'selected':''}>${y}</option>`).join('')}</select>${adm()?'<button class="btn" onclick="addFail()">+ Ghi nhận hư hỏng</button>':''}`)+
 `<div class="tw"><table><thead><tr><th>Thống kê ${Y}</th>${m.map(i=>`<th>T${i+1}</th>`).join('')}<th>Cả năm</th></tr></thead><tbody>${st.map(r=>`<tr><td>${E(nm(r.e))}</td>${r.c.map(v=>`<td class="c">${v||''}</td>`).join('')}<td class="c"><b>${r.n}</b></td></tr>`).join('')||'<tr><td colspan="14" class="mu">Chưa có hư hỏng trong năm này.</td></tr>'}</tbody></table></div>
 <div class="tw"><table><thead><tr><th>Ngày</th><th>Khối thiết bị</th><th>Mô tả</th><th>Nguyên nhân</th><th>Khắc phục</th><th>Người ghi</th><th></th></tr></thead><tbody>${D.fail.filter(f=>inG(f.equipId)).sort((a,b)=>b.ngay>a.ngay?1:-1).map(f=>`<tr><td>${E(f.ngay)}</td><td><b>${E(nmE(f.equipId))}</b></td><td>${E(f.mota)}</td><td>${E(f.nguyennhan)}</td><td>${E(f.khacphuc)}</td><td>${E(f.nguoi)}</td><td>${adm()?`<button class="btn btn-d btn-s" onclick="del('fail','${f.id}')">Xóa</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7" class="mu">Chưa có bản ghi.</td></tr>'}</tbody></table></div>`}
const opt=(a,k)=>a.map(x=>`<option value="${x.id}">${E(nm(x))}${x.nhom?' ('+E(x.nhom)+')':''}${x.sn?' - '+E(x.sn):''}</option>`).join('');
function addFail(){mdl('Ghi nhận hư hỏng',`<label>Khối thiết bị</label><select id="x1">${opt(D.equip)}</select><label>Ngày</label><input type="date" id="x2" value="${today()}"><label>Mô tả hư hỏng</label><textarea id="x3" rows="2"></textarea><label>Nguyên nhân</label><input id="x4"><label>Cách khắc phục</label><input id="x5">`,async()=>{
 if(!$('x1').value||!$('x3').value)throw new Error('Chọn khối thiết bị và nhập mô tả');
 D=await api('save',{t:'fail',row:{equipId:$('x1').value,ngay:$('x2').value,mota:$('x3').value,nguyennhan:$('x4').value,khacphuc:$('x5').value}});render();toast('Đã ghi nhận');return true})}

function swapV(){return head('Thay thế bằng vật tư dự phòng'+(G==='all'?'':' - '+E(G)),adm()?'<button class="btn" onclick="addSwap()">+ Ghi nhận thay thế</button>':'')+
 `<div class="tw"><table><thead><tr><th>Ngày</th><th>Người thay</th><th>Khối thiết bị bị thay</th><th>Vật tư dự phòng sử dụng</th><th>Số lượng</th><th>Ghi chú</th></tr></thead><tbody>${D.swap.filter(s=>inG(s.equipId)).sort((a,b)=>b.ngay>a.ngay?1:-1).map(s=>`<tr><td>${E(s.ngay)}</td><td>${E(s.nguoi)}</td><td>${E(nmE(s.equipId))}</td><td>${E(nmS(s.spareId))}</td><td class="c">${E(s.sl)}</td><td>${E(s.ghichu)}</td></tr>`).join('')||'<tr><td colspan="6" class="mu">Chưa có bản ghi.</td></tr>'}</tbody></table></div>`}
function addSwap(){mdl('Ghi nhận thay thế',`<label>Khối thiết bị bị thay</label><select id="x1">${opt(D.equip)}</select><label>Vật tư dự phòng sử dụng</label><select id="x2">${opt(D.spare.filter(s=>slN(s.sl)>0))}</select><label>Số lượng</label><input type="number" id="x3" value="1" min="1"><label>Ghi chú</label><input id="x4">`,async()=>{
 if(!$('x1').value||!$('x2').value)throw new Error('Chọn khối thiết bị và vật tư dự phòng');
 D=await api('swap',{row:{equipId:$('x1').value,spareId:$('x2').value,sl:$('x3').value,ghichu:$('x4').value}});render();toast('Đã ghi nhận, số lượng vật tư dự phòng đã cập nhật');return true})}
</script></body></html>
