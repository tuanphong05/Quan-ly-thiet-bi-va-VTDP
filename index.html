<style>
:root{--blue:#1a3a6b;--blue-light:#e8eef7;--accent:#c0392b;--border:#cdd3db;--bg:#f4f6f9;--white:#fff;--text:#1e2a3a;--muted:#6b7a8d;--ok:#1e7e4f;--wa:#b36200;--radius:8px;--shadow:0 2px 8px rgba(0,0,0,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:13px;display:flex;flex-direction:column;height:100vh}
.hidden{display:none!important}button{font:inherit;cursor:pointer}
.btn{padding:7px 12px;border-radius:6px;border:1px solid var(--blue);background:var(--blue);color:#fff;font-weight:600;font-size:12px}
.btn-o{background:#fff;color:var(--blue)}.btn-d{background:#fff;color:var(--accent);border-color:var(--accent)}.btn-s{padding:4px 9px;font-size:11.5px}.btn:disabled{opacity:.5}
#login{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center}
.lc{background:#fff;border:1px solid var(--border);border-radius:18px;padding:36px 44px;width:400px;max-width:92vw;box-shadow:0 24px 64px rgba(10,25,50,.25);display:flex;flex-direction:column;align-items:center}
.lc h2{font-size:14px;color:var(--blue);text-align:center;line-height:1.5}.lc small{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:2px 0 18px}

.lc input{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font:inherit;font-size:14px;margin-bottom:12px;background:#f8f9fb}
.lc .btn{width:100%;padding:12px;font-size:14px}#le{color:var(--accent);font-size:12px;font-weight:600;min-height:18px;margin-top:8px}
.top{height:64px;flex-shrink:0;background:var(--blue);color:#fff;display:flex;align-items:center;gap:12px;padding:0 20px;box-shadow:0 2px 8px #0003}
.bn{font-size:15px;font-weight:800}.bs{font-size:11px;opacity:.8}
.clk{margin-left:auto;text-align:right;line-height:1.4}.clk div:first-child{font-size:12px;opacity:.85}.clk div:last-child{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.shell{display:flex;flex:1;min-height:0}
.nav{width:226px;flex-shrink:0;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
.nu{padding:14px;border-bottom:1px solid var(--border);text-align:center;font-size:12.5px;font-weight:700;color:var(--blue);line-height:1.35}
.nu small{display:block;font-size:10.5px;font-weight:400;color:var(--muted);text-transform:uppercase;margin-top:5px}
.na{padding:10px 14px 14px;border-bottom:1px solid var(--border)}
.ml{padding:10px}.mi{display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--radius);cursor:pointer;font-size:12.5px;font-weight:600;margin-bottom:2px;border-left:3px solid transparent}
.mi:hover,.mi.on{background:var(--blue-light)}.mi.on{border-left-color:var(--blue);color:var(--blue)}
.ms{padding:9px 10px;font-size:12.5px;font-weight:600;gap:6px}.ms.gr{color:var(--blue);background:var(--blue-light)}
.sb{padding:7px 10px 7px 30px;font-size:12px;font-weight:500}.ms span{width:12px;flex-shrink:0;font-size:10px}
.nh{margin-top:auto;padding:12px 14px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);text-align:center}
.main{flex:1;min-width:0;overflow:auto}.pg{padding:16px 20px}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.ph h2{font-size:17px;color:var(--blue);margin-right:auto}
.ph input,.ph select{padding:6px 10px;border:1px solid var(--border);border-radius:6px;font:inherit;background:#fff}
.ch{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.ch button{border:1px solid var(--border);background:#fff;border-radius:99px;padding:4px 12px}.ch .on{border-color:var(--blue);color:var(--blue);font-weight:700}
.lg{width:44px;height:44px;border-radius:50%;flex-shrink:0;background:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.ll{width:84px;height:84px;margin-bottom:10px}
#zoom{position:fixed;z-index:60;display:none;pointer-events:none;background:#fff;padding:4px;border-radius:10px;box-shadow:0 10px 36px rgba(0,0,0,.35)}
#zoom img{display:block;max-width:420px;max-height:420px;border-radius:6px}
#lbx{position:fixed;inset:0;z-index:65;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;cursor:zoom-out}
#lbx img{max-width:92vw;max-height:92vh;border-radius:8px;background:#fff}
.th{transition:transform .12s;cursor:zoom-in}.th:hover{transform:scale(1.06)}
.fbar{background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.tabs{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--border);background:#fafbfd;overflow-x:auto}
.tabs button{display:flex;align-items:center;gap:8px;padding:12px 14px 10px;border:0;border-bottom:3px solid transparent;background:none;color:var(--muted);font-size:12.5px;font-weight:600;white-space:nowrap;transition:.15s}
.tabs button:hover{color:var(--blue);background:var(--blue-light)}.tabs button.on{color:var(--blue);border-bottom-color:var(--blue);background:#fff}
.bd{min-width:24px;padding:1px 7px;border-radius:99px;background:#e4e9f0;color:var(--muted);font-size:11px;font-weight:700;text-align:center}
.tabs .on .bd{background:var(--blue);color:#fff}
.frow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 14px}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:9px;background:#e9edf3;flex-wrap:wrap}
.seg button{display:flex;align-items:center;gap:7px;padding:6px 13px;border:0;border-radius:7px;background:none;color:var(--muted);font-size:12px;font-weight:600;transition:.15s}
.seg button:hover{color:var(--text)}.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.seg i{width:8px;height:8px;border-radius:50%;flex-shrink:0}.seg button span{font-size:11px;font-weight:700;opacity:.65}
.gc{min-width:200px;max-width:320px;white-space:pre-wrap}
.fr2{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.gm{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--blue);cursor:pointer}.gm input{accent-color:var(--blue)}
.gh td{background:var(--blue-light);border-top:2px solid var(--blue);padding:9px 10px;cursor:pointer}.gh:hover td{background:#dde7f5}
.gl{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.gl b{font-size:13px;color:var(--blue)}.tg{width:12px;font-size:10px;color:var(--blue)}.gh .bd{background:var(--blue);color:#fff}
.gi td{background:#fafcff}.gi td:first-child{box-shadow:inset 4px 0 0 var(--blue)}
.tw{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow-x:auto;box-shadow:var(--shadow);margin-bottom:14px}
.twb{max-height:calc(100vh - 150px);overflow:auto}.twb thead th{position:sticky;top:0;z-index:3}.twb thead th.stk{z-index:4}
.fz{position:sticky}td.fz{background:#fff;z-index:2}.twb thead th.fz{z-index:5}.fz.e{box-shadow:2px 0 0 var(--border)}
.nks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--blue-light);border-radius:8px;padding:10px 12px;font-size:13px}.nks span{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase}
.mb input[type=checkbox]{width:auto}.ck{display:flex;align-items:center;gap:8px;font-size:13px!important;color:var(--text)!important;cursor:pointer}
.nkb{display:flex;gap:8px;flex-wrap:wrap}.nkl{display:flex;flex-direction:column;gap:8px}.nki{border:1px solid var(--border);border-left:4px solid var(--blue);border-radius:8px;padding:8px 12px;font-size:13px}.nki.hh{border-left-color:#c0392b}
.nkh{display:flex;align-items:center;gap:10px;margin-bottom:3px}.nkh a{margin-left:auto;font-size:12px;color:#c0392b}
@media(max-width:640px){.nks{grid-template-columns:1fr 1fr}}
table.big{width:max-content;min-width:100%}table.big td{font-size:12.5px;vertical-align:top}.stk{position:sticky;right:0;background:#fff;box-shadow:-2px 0 0 var(--border)}th.stk{background:var(--blue)}
.gh .gl{position:sticky;left:12px;width:max-content;max-width:90vw}.mb.wide{width:760px}.fg{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}.fc{display:flex;flex-direction:column;gap:3px}.fc.s2{grid-column:1/-1}
@media(max-width:640px){.fg{grid-template-columns:1fr}}

td{padding:8px 10px;border-top:1px solid var(--border);vertical-align:top}.mu{color:var(--muted);font-size:12px}.c{text-align:center}
.st{font-size:11.5px;font-weight:700;border:1px solid;border-radius:99px;padding:1px 9px;white-space:nowrap}
.rs{margin-top:4px;padding:4px 8px;border-left:3px solid var(--border);font-size:12px}
.th{width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--border);margin-right:4px;cursor:pointer}
.mo{position:fixed;inset:0;background:#0007;z-index:40;display:flex;align-items:center;justify-content:center}
.mb{background:#fff;border-radius:12px;padding:18px;width:460px;max-width:94vw;max-height:92vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.mb input,.mb select,.mb textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font:inherit}
.mb label{font-size:11.5px;font-weight:700;color:var(--muted);margin-top:2px}.mb h3{color:var(--blue);font-size:15px}.mb .r{display:flex;gap:8px;justify-content:flex-end}
#er{color:var(--accent);font-size:12px;min-height:16px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1e2a3a;color:#fff;padding:8px 14px;border-radius:8px;z-index:70;font-size:12.5px}.toast.er{background:#c0392b}.toast:empty{display:none}
.hb{display:none;background:none;border:0;color:#fff;font-size:24px;line-height:1;padding:6px 8px;cursor:pointer}.ov{display:none}
@media(max-width:760px){
.hb{display:block}.top{height:56px;padding:0 10px;gap:8px}.top .lg{height:38px;width:38px}.bs,.clk div:first-child{display:none}.bn{font-size:13px;line-height:1.25}.clk div:last-child{font-size:13px}
.nav{position:fixed;left:0;top:56px;bottom:0;width:285px;max-width:85vw;z-index:50;transform:translateX(-100%);transition:transform .2s;box-shadow:4px 0 16px #0004}
body.nvo .nav{transform:none}body.nvo .ov{display:block;position:fixed;inset:56px 0 0 0;background:#0006;z-index:40}
.mi{padding:13px 10px;font-size:14px}.sb{padding:11px 10px 11px 30px;font-size:13.5px}
.pg{padding:10px}.ph h2{flex:1 1 100%;font-size:15px}.ph input{flex:1 1 0;min-width:0}.ph .btn{flex-shrink:0}
.frow{padding:8px 10px}.fr2{width:100%;justify-content:space-between}.seg{width:100%}.seg button{flex:1 1 45%;justify-content:center}
.twb{max-height:none;overflow:visible;background:none;border:0;box-shadow:none}
.twb table.big,.twb tbody,.twb tr,.twb td{display:block;width:100%;min-width:0}
.twb thead{display:none}
.twb tr{display:flex;flex-direction:column;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);margin-bottom:10px;padding:10px 12px}
.twb td{display:flex;gap:10px;padding:3px 0;border:0;font-size:13px;position:static!important;width:auto!important;min-width:0!important;max-width:none!important;background:none!important;box-shadow:none!important;text-align:left}
.twb td:empty,.twb td[data-s]{display:none}.twb tr.open td[data-s]:not(:empty){display:flex}
.twb td::before{content:attr(data-l);flex:0 0 125px;color:var(--muted);font-size:11.5px;font-weight:600;padding-top:1px}
.twb td.e{order:-2;font-size:15px;color:var(--blue);cursor:pointer;padding-bottom:6px;margin-bottom:4px;border-bottom:1px solid var(--border)}
.twb td.e::before{display:none}.twb td.e::after{content:'Chi tiết ▾';margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:600;white-space:nowrap}
.twb tr.open td.e::after{content:'Thu gọn ▴'}
.twb td.fz:not(.e){order:-1}
.twb td.c{text-align:left}.twb td[data-l="Thao tác"]{padding-top:8px}.twb td[data-l="Thao tác"]::before{display:none}
.mb,.mb.wide{width:96vw;padding:14px}
}

 `<div class="tw"><table><thead><tr><th>Thời gian thay thế</th><th>Người thay thế</th><th>Khối thiết bị bị thay</th><th>Serial Number khối thay ra</th><th>Part Number khối thay ra</th><th>Vật tư dự phòng sử dụng</th><th>Serial Number khối thay vào</th><th>Part Number khối thay vào</th><th>Số lượng</th><th>Tình trạng hoạt động sau thay thế</th><th>Ghi chú</th><th>Người ghi</th>${adm()?'<th></th>':''}</tr></thead><tbody>${D.swap.filter(s=>inG(s.equipId)).sort((a,b)=>String(b.thoigian||b.ngay).localeCompare(String(a.thoigian||a.ngay))).map(s=>`<tr style="cursor:pointer" title="Nhấn để xem chi tiết" onclick="swD('${s.id}')"><td>${E(s.thoigian||s.ngay)}</td><td>${E(s.nguoitt)}</td><td>${E(nmE(s.equipId))}</td><td>${E(s.snCu)}</td><td>${E(s.pnCu)}</td><td>${E(nmS(s.spareId))}</td><td>${E(s.snMoi)}</td><td>${E(s.pnMoi)}</td><td class="c">${E(s.sl)}</td><td class="c">${s.ttsau?chip(s.ttsau):''}</td><td>${E(s.ghichu)}</td><td>${E(s.nguoi)}</td>${adm()?`<td><a href="#" onclick="swX('${s.id}');return false">Xóa</a></td>`:''}</tr>`).join('')||'<tr><td colspan="13" class="mu">Chưa có bản ghi.</td></tr>'}</tbody></table></div>`}
function addSwap(){mdl('Ghi nhận thay thế',`<label>Khối thiết bị bị thay</label><select id="x1">${opt(D.equip)}</select><label>Vật tư dự phòng sử dụng</label><select id="x2">${opt(D.spare.filter(s=>slN(s.sl)>0))}</select><div id="pv" style="margin:8px 0"></div><label>Số lượng</label><input type="number" id="x3" value="1" min="1"><label>Thời gian thay thế</label><input type="datetime-local" id="x5" value="${nowL()}"><label>Người thay thế</label><select id="x6">${NTH.map(x=>`<option>${x}</option>`).join('')}</select><label>Tình trạng hoạt động sau thay thế</label><select id="x7">${ST.map(x=>`<option>${x}</option>`).join('')}</select><label>Ghi chú</label><input id="x4">`,async()=>{
 if(!$('x1').value||!$('x2').value)throw new Error('Chọn khối thiết bị và vật tư dự phòng');
 if(!$('x5').value)throw new Error('Nhập thời gian thay thế');
 D=await api('swap',{row:{equipId:$('x1').value,spareId:$('x2').value,sl:$('x3').value,ghichu:$('x4').value,thoigian:$('x5').value.replace('T',' '),nguoitt:$('x6').value,ttsau:$('x7').value}});render();toast('Đã ghi nhận, đã cập nhật Serial Number, Part Number và vật tư dự phòng');return true});$('x1').onchange=$('x2').onchange=swPv;swPv()}

// ===== NHẬT KÝ BẢO TRÌ, BẢO DƯỠNG =====
const NTH=['Nhân viên kỹ thuật','Kíp trưởng','Phụ trách kíp','Hỗ trợ kỹ thuật'];
const LNK=['Bảo dưỡng định kỳ','Sửa chữa','Kiểm tra','Hiệu chuẩn','Khác'],LG=()=>D.log||[];
const cl=d=>String(d||'').localeCompare('');
const dd=d=>Math.round((Date.parse(d)-Date.parse(today()))/864e5);
function bti(id){const L=LG().filter(l=>l.equipId==id).sort((a,b)=>String(b.ngay).localeCompare(String(a.ngay)));
 const last=L.find(l=>l.loai==='Bảo dưỡng định kỳ'),nx=L.find(l=>l.loai==='Bảo dưỡng định kỳ'&&l.tiep),next=nx?nx.tiep:'';
 let st='Chưa có lịch',c='#6b7a90',r=3;
 if(next&&!isNaN(Date.parse(next))){const n=dd(next);if(n<0){st='Quá hạn '+(-n)+' ngày';c='#c0392b';r=0}else if(n<=30){st='Sắp đến hạn ('+n+' ngày)';c='#b36200';r=1}else{st='Còn hạn';c='#1e7e4f';r=2}}
 return{L,last:last?last.ngay:'',next,st,c,r}}
const stB=b=>`<span class="st" style="color:${b.c}">${E(b.st)}</span>`;
function nk(id){const e=fnd(id)||{},b=bti(id);
 const A=[...D.fail.filter(f=>f.equipId==id).map(f=>({k:'f',id:f.id,ngay:f.ngay,loai:'Sự cố',nd:f.mota,ex:[['Nguyên nhân',f.nguyennhan],['Đánh giá ảnh hưởng đến hệ thống',f.anhhuong],['Cách khắc phục',f.khacphuc],['Khắc phục ngày',f.ngaykp]],ng:f.nguoi,open:!String(f.khacphuc||'').trim()})),
 ...b.L.map(l=>({k:'l',id:l.id,ngay:l.ngay,loai:l.loai,nd:l.noidung,ex:[['Người thực hiện',l.thuchien],['Kết quả',l.ketqua],['Bảo dưỡng tiếp theo',l.tiep],['Xác nhận đã khắc phục',l.xacnhan?l.xacnhan+' - '+(l.xnnguoi||''):'']],ng:l.nguoi,rep:l.loai==='Sửa chữa'&&!String(l.xacnhan||'').trim()}))].sort((a,c)=>String(c.ngay).localeCompare(String(a.ngay)));
 mdl('Nhật ký - '+nm(e),`<div class="nks"><div><span>Serial Number</span>${E(e.sn)||'-'}</div><div><span>Part Number</span>${E(e.pn)||'-'}</div><div><span>Bảo dưỡng gần nhất</span>${E(b.last)||'-'}</div><div><span>Bảo dưỡng tiếp theo</span>${E(b.next)||'-'}</div><div><span>Tình trạng bảo dưỡng</span>${stB(b)}</div><div><span>Tình trạng thiết bị</span>${chip(e.tt)}</div><div><span>Số lần sự cố</span><b>${D.fail.filter(f=>f.equipId==id).length}</b></div></div>
 ${adm()?`<div class="nkb"><button class="btn btn-s" onclick="addLog('${id}')">+ Ghi nhật ký bảo dưỡng</button><button class="btn btn-d btn-s" onclick="addFail('${id}')">+ Ghi nhận sự cố</button></div>`:''}
 <div class="nkl">${A.map(a=>`<div class="nki ${a.k==='f'?'hh':''}"><div class="nkh"><b>${E(a.ngay)}</b><span class="bd">${E(a.loai)}</span>${a.open?'<span class="st" style="color:#c0392b">Đang sự cố</span>':''}${a.rep?'<span class="st" style="color:#1a56b8">Đang sửa chữa</span>':''}${a.rep&&adm()?`<button class="btn btn-s" onclick="xnKP('${a.id}','${id}')">Xác nhận đã khắc phục</button>`:''}${a.open&&adm()?`<button class="btn btn-o btn-s" onclick="addLog('${id}','Sửa chữa')">Ghi nhận sửa chữa</button>`:''}${a.open&&adm()?`<button class="btn btn-s" onclick="kp('${a.id}','${id}')">Cập nhật cách khắc phục</button>`:''}${adm()?`<a href="#" onclick="nkDel('${a.k}','${a.id}','${id}');return false">Xóa</a>`:''}</div>
 <div>${E(a.nd)}</div>${a.ex.filter(x=>x[1]).map(x=>`<div class="mu">${x[0]}: ${E(x[1])}</div>`).join('')}<div class="mu">Ghi bởi ${E(a.ng)}</div></div>`).join('')||'<div class="mu">Chưa có nhật ký cho thiết bị này.</div>'}</div>`,null,true)}
async function nkDel(k,id,eid){if(!confirm('Xóa mục nhật ký này?'))return;try{D=await api('del',{t:k==='f'?'fail':'log',id});render();toast('Đã xóa');nk(eid)}catch(e){toast(e.message,1)}}
function addLog(eid,pre){mdl('Ghi nhật ký bảo dưỡng - '+nmE(eid),`<div class="fg"><div class="fc"><label>Ngày thực hiện</label><input type="date" id="l1" value="${today()}"></div>
 <div class="fc"><label>Loại công việc</label><select id="l2" onchange="$('lx').style.display=this.value==='Sửa chữa'?'':'none';$('lt').style.display=this.value==='Bảo dưỡng định kỳ'?'':'none'">${LNK.map(x=>`<option ${x===pre?'selected':''}>${x}</option>`).join('')}</select></div>
 <div class="fc s2" id="lx" style="display:${pre==='Sửa chữa'?'':'none'}"><label class="ck"><input type="checkbox" id="l7"> Đã sửa chữa xong, xác nhận thiết bị đã được khắc phục</label><div class="mu">Nếu chưa tích, thiết bị chuyển sang trạng thái Đang sửa chữa cho đến khi bạn xác nhận khắc phục.</div></div>
 <div class="fc s2"><label>Nội dung thực hiện</label><textarea id="l3" rows="3"></textarea></div>
 <div class="fc"><label>Người thực hiện</label><select id="l4">${NTH.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="fc"><label>Kết quả</label><input id="l5" placeholder="VD: Hoạt động bình thường"></div>
 <div class="fc" id="lt" style="display:${!pre||pre==='Bảo dưỡng định kỳ'?'':'none'}"><label>Ngày bảo dưỡng tiếp theo</label><input type="date" id="l6"></div></div>`,async()=>{
 if(!$('l1').value||!$('l3').value)throw new Error('Nhập ngày và nội dung thực hiện');
 D=await api('save',{t:'log',row:{equipId:eid,ngay:$('l1').value,loai:$('l2').value,noidung:$('l3').value,thuchien:$('l4').value,ketqua:$('l5').value,tiep:$('l2').value==='Bảo dưỡng định kỳ'?$('l6').value:'',xong:$('l2').value==='Sửa chữa'&&$('l7').checked}});render();toast('Đã ghi nhật ký');nk(eid);return false},true)}
let BA=false;
const trk=id=>LG().some(l=>l.equipId==id);   // thiết bị đang được theo dõi bảo dưỡng = đã có ít nhất một mục nhật ký
const btBase=()=>D.equip.filter(x=>x.nhom===G&&(BA||trk(x.id)));
function btV(){const cb=CAB[G],base=btBase();SH=cb?cb.filter(c=>base.some(x=>x.tu===c)):[];if(cb)C=SH.includes(C)?C:(SH[0]||'');
 const q=base.filter(x=>!C||x.tu===C).map(x=>({x,b:bti(x.id)})),c=[0,1,2,3].map(r=>q.filter(y=>y.b.r===r).length);
 const tabs=SH.length?`<div class="tabs">${SH.map((t,i)=>`<button class="${C===t?'on':''}" onclick="C=SH[${i}];render()">${E(t)}<span class="bd">${base.filter(x=>x.tu===t).length}</span></button>`).join('')}</div>`:'';
 return head('Bảo dưỡng - '+E(G)+(C?' - '+E(C):''),`<input placeholder="Tìm theo tên, Serial Number, Part Number..." value="${E(S)}" oninput="S=this.value;btRows()">`)+
 `<div class="fbar">${tabs}<div class="frow"><div class="seg"><span class="st" style="color:#c0392b;padding:6px 10px">Quá hạn: <b>${c[0]}</b></span><span class="st" style="color:#b36200;padding:6px 10px">Sắp đến hạn: <b>${c[1]}</b></span><span class="st" style="color:#1e7e4f;padding:6px 10px">Còn hạn: <b>${c[2]}</b></span><span class="st" style="color:#6b7a90;padding:6px 10px">Chưa có lịch: <b>${c[3]}</b></span></div><div class="fr2"><label class="gm"><input type="checkbox" ${BA?'checked':''} onchange="BA=this.checked;render()"> Hiện cả thiết bị chưa được theo dõi bảo dưỡng</label><span class="mu" id="cnt"></span></div></div></div>
 <div class="tw"><table><thead><tr><th>Số thứ tự</th><th>Tên sử dụng</th><th>Phân hệ / Tủ thiết bị</th><th>Serial Number</th><th>Bảo dưỡng gần nhất</th><th>Bảo dưỡng tiếp theo</th><th>Tình trạng bảo dưỡng</th><th>Số lần sự cố</th><th>Thao tác</th></tr></thead><tbody id="bb"></tbody></table></div>`}
function btRows(){const q=S.toLowerCase(),a=btBase().filter(x=>(!C||x.tu===C)&&[nm(x),x.tu,x.sn,x.pn,x.tenkt].join(' ').toLowerCase().includes(q)).map(x=>({x,b:bti(x.id)}))
 .sort((p,r)=>p.b.r-r.b.r||String(p.b.next).localeCompare(String(r.b.next))||cmpX(p.x,r.x));
 $('cnt').textContent='Hiển thị '+a.length+' thiết bị';
 $('bb').innerHTML=a.map(({x,b})=>`<tr><td>${E(x.stt)}</td><td><b>${E(nm(x))}</b></td><td>${E(x.tu)}</td><td>${E(x.sn)}</td><td>${E(b.last)}</td><td>${E(b.next)}</td><td class="c">${stB(b)}</td><td class="c"><b>${D.fail.filter(f=>f.equipId==x.id).length}</b></td><td><button class="btn btn-s" onclick="nk('${x.id}')">Nhật ký</button></td></tr>`).join('')||'<tr><td colspan="9" class="mu">Chưa có thiết bị nào được theo dõi bảo dưỡng. Bấm Nhật ký ở mục Khối thiết bị để bắt đầu, hoặc tích ô hiện cả thiết bị chưa theo dõi.</td></tr>'}

// Cập nhật "Cách khắc phục" cho một sự cố: khi có nội dung, thiết bị tự trở lại trạng thái "Tốt" (nếu không còn sự cố nào khác)
function kp(fid,eid){const f=D.fail.find(x=>x.id==fid);if(!f)return;eid=eid||f.equipId;
 mdl('Cập nhật cách khắc phục - '+nmE(f.equipId),`<div class="nki hh"><b>${E(f.ngay)}</b> - ${E(f.mota)}</div><label>Nguyên nhân</label><input id="k1" value="${E(f.nguyennhan)}"><label>Đánh giá ảnh hưởng đến hệ thống</label><textarea id="k3" rows="2">${E(f.anhhuong)}</textarea><label>Cách khắc phục</label><textarea id="k2" rows="3" placeholder="Nhập nội dung đã khắc phục. Sau khi lưu, thiết bị trở lại trạng thái Tốt."></textarea>`,async()=>{
 if(!$('k2').value.trim())throw new Error('Nhập nội dung cách khắc phục');
 D=await api('save',{t:'fail',row:{...f,nguyennhan:$('k1').value,anhhuong:$('k3').value,khacphuc:$('k2').value.trim()}});render();toast('Đã cập nhật, thiết bị trở lại trạng thái Tốt');if(V==='fail')return true;nk(eid);return false})}

// Xác nhận thiết bị đã được khắc phục sau sửa chữa -> thiết bị trở lại trạng thái "Tốt"
function xnKP(lid,eid){const l=LG().find(x=>x.id==lid);if(!l)return;
 mdl('Xác nhận khắc phục - '+nmE(eid),`<div class="nki"><b>${E(l.ngay)}</b> - ${E(l.noidung)}</div><label>Kết quả sau sửa chữa</label><input id="y1" value="${E(l.ketqua)}" placeholder="VD: Hoạt động bình thường"><label class="ck"><input type="checkbox" id="y2"> Tôi xác nhận thiết bị đã được khắc phục và hoạt động bình thường</label>`,async()=>{
 if(!$('y2').checked)throw new Error('Hãy tích ô xác nhận thiết bị đã được khắc phục');
 D=await api('save',{t:'log',row:{...l,ketqua:$('y1').value,xong:true}});render();toast('Đã xác nhận, thiết bị trở lại trạng thái Tốt');nk(eid);return false})}
</script></body></html>
